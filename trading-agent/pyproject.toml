[project]
name = "tradeagent"
version = "0.1.0"
description = "Paper-first crypto trading agent: deterministic state engine, typed judge, hard risk layer, nightly calibration review."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only needed for the Opus escalation / nightly review calls. The live loop runs without it.
brain = ["anthropic"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
