<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bowl Mania Admin</title><link rel="stylesheet" href="styles.css"><style>body{padding:30px;background:#eef5df}.admin{max-width:1100px;margin:auto}.box{background:#fff;padding:24px;border-radius:24px;box-shadow:0 15px 45px #174b2012;margin:20px 0}input,select,button{padding:11px;border:1px solid #ccd8c8;border-radius:10px;font:inherit}button{cursor:pointer;background:#0b5a35;color:white}.login{max-width:420px;margin:10vh auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.order{border-top:1px solid #dde5d8;padding:18px 0}.muted{color:#68776d;font-size:13px}.pill{padding:6px 10px;border-radius:999px;background:#eaf4d7;color:#18572f;font-size:12px;font-weight:800}</style></head><body><main class="admin"><section id="login" class="box login"><span class="eyebrow">BOWL MANIA</span><h2>Admin</h2><p class="muted">Sign in to manage incoming orders.</p><input id="password" type="password" placeholder="Admin password" style="width:100%"><button id="loginBtn" style="width:100%;margin-top:12px">Sign in</button><p id="loginMsg"></p></section><section id="dashboard" hidden><div class="box"><div class="toolbar"><h2 style="margin:0 auto 0 0">Orders</h2><button onclick="loadOrders()">Refresh</button><button onclick="logout()">Log out</button></div></div><div id="orders" class="box"></div></section></main><script>
let token=localStorage.bowlAdminToken||'';const $=s=>document.querySelector(s);function show(){if(token){$('#login').hidden=true;$('#dashboard').hidden=false;loadOrders()}else{$('#login').hidden=false;$('#dashboard').hidden=true}}async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const d=await r.json();if(!r.ok){$('#loginMsg').textContent=d.error;return}token=d.token;localStorage.bowlAdminToken=token;show()}async function loadOrders(){const r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+token}});if(r.status===401)return logout();const data=await r.json();$('#orders').innerHTML=data.length?data.map(o=>`<article class="order"><div class="toolbar"><strong>#${o.id} · ${o.customer_name}</strong><span class="pill">${o.status}</span><select onchange="updateStatus(${o.id},this.value)">${['new','confirmed','preparing','out_for_delivery','completed','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><p>${o.phone} · ${o.area}<br>${o.address}</p><p class="muted">${o.items.map(i=>`${i.quantity}× ${i.name} (${i.size})`).join('<br>')}<br>Subtotal ₹${o.subtotal} · Delivery ₹${o.delivery_charge} · <b>Total ₹${o.total}</b></p><p class="muted">${o.notes||''}<br>${o.created_at}</p></article>`).join(''):'<p>No orders yet.</p>'}async function updateStatus(id,status){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status})});loadOrders()}function logout(){localStorage.removeItem('bowlAdminToken');token='';show()}$('#loginBtn').onclick=login;show();</script></body></html>
