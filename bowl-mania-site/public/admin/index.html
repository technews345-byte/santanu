<!doctype html>
<html lang="en">
<head>

<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>

    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>

</svg>

<div id="auth" class="auth" hidden></div>

<div id="shell" class="shell" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="side-brand">
      <img src="/assets/logo.jpg" alt="" width="44" height="44">
      <div><b>Bowl Mania</b><span>Restaurant admin</span></div>
      <button class="icon-btn only-mobile" type="button" data-close-sidebar aria-label="Close menu"><svg><use href="#i-close"/></svg></button>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <a href="#/account" class="profile" id="profileLink">
        <span class="avatar" id="profileAvatar"></span>
        <span><b id="profileName"></b><small id="profileRole"></small></span>
      </a>
      <button class="icon-btn" type="button" id="logoutBtn" title="Log out" aria-label="Log out"><svg><use href="#i-logout"/></svg></button>
    </div>
  </aside>
  <div class="scrim" data-close-sidebar hidden></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn only-mobile" type="button" id="openSidebar" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
      <form class="global-search" id="globalSearch" role="search">
        <svg><use href="#i-search"/></svg>
        <input type="search" id="globalSearchInput" placeholder="Search orders, customers, phone…" aria-label="Search orders and customers" autocomplete="off">
        <div class="search-results" id="searchResults" hidden></div>
      </form>
      <div class="top-actions">
        <span class="clock hide-sm" id="clock"></span>
        <div class="status-switch" id="statusSwitch"></div>
        <button class="btn btn-primary btn-sm hide-xs" type="button" id="quickNewOrder"><svg><use href="#i-plus"/></svg> New order</button>
        <div class="bell-wrap">
          <button class="icon-btn bell" type="button" id="bellBtn" aria-label="Notifications" aria-expanded="false"><svg><use href="#i-bell"/></svg><span class="count" id="bellCount" hidden></span></button>
          <div class="popover" id="bellPanel" hidden></div>
        </div>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="overlay-root"></div>
<script type="module" src="/admin/js/app.js"></script>
</body>
</html>
