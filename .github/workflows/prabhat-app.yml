# Builds and tests the Prabhat (morning mantra) Android app and publishes installable APKs.
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   PRABHAT_KEYSTORE_BASE64, PRABHAT_KEYSTORE_PASSWORD, PRABHAT_KEY_ALIAS, PRABHAT_KEY_PASSWORD
#     Release signing key. Without it the release APK is signed with a throwaway debug key.
name: Prabhat app

on:
  push:
    paths: ['prabhat-app/**', '.github/workflows/prabhat-app.yml']
  pull_request:
    paths: ['prabhat-app/**', '.github/workflows/prabhat-app.yml']
  workflow_dispatch:

permissions:
  contents: write   # publish the APK as a GitHub Release (main branch and manual runs only)

concurrency:
  group: prabhat-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: prabhat-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.PRABHAT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/prabhat.jks"
            echo "PRABHAT_KEYSTORE_FILE=$RUNNER_TEMP/prabhat.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No PRABHAT_KEYSTORE_BASE64 secret: the release APK is signed with a debug key (fine for testing, not for the Play Store)."
          fi

      - name: Unit tests and build
        env:
          PRABHAT_VERSION_CODE: ${{ github.run_number }}
          PRABHAT_KEYSTORE_PASSWORD: ${{ secrets.PRABHAT_KEYSTORE_PASSWORD }}
          PRABHAT_KEY_ALIAS: ${{ secrets.PRABHAT_KEY_ALIAS }}
          PRABHAT_KEY_PASSWORD: ${{ secrets.PRABHAT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p ../apk
          cp app/build/outputs/apk/release/app-release.apk ../apk/Prabhat-${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../apk/Prabhat-${{ github.run_number }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Prabhat-apk-${{ github.run_number }}
          path: apk/*.apk
          retention-days: 30

      # Download from the repository's Releases page (the rider app keeps the "latest" release).
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ../apk/Prabhat-${{ github.run_number }}.apk ../apk/Prabhat.apk
          tag="prabhat-v1.0.${{ github.run_number }}"
          gh release create "$tag" ../apk/Prabhat.apk --target "${{ github.sha }}" --latest=false \
            --title "Prabhat 1.0 (build ${{ github.run_number }})" \
            --notes "Prabhat — your morning mantra. Download Prabhat.apk on the phone, open it and allow installing from this source."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prabhat-test-reports
          path: prabhat-app/app/build/reports/
          retention-days: 7
