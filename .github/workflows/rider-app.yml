# Builds and tests the Bowl Mania Rider Android app and publishes installable APKs as build artifacts.
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   MAPS_API_KEY                         Google Maps key (map + road routes). Without it the app shows approximate distances.
#   FIREBASE_APP_ID, FIREBASE_API_KEY,   Firebase Cloud Messaging. Without them the app checks for new deliveries
#   FIREBASE_PROJECT_ID, FIREBASE_SENDER_ID  every 30 seconds while online instead of receiving pushes.
#   RIDER_KEYSTORE_BASE64, RIDER_KEYSTORE_PASSWORD (+ optional RIDER_KEY_ALIAS, default "rider"; RIDER_KEY_PASSWORD, default = keystore password)
#                                        Release signing key. Without it the release APK is signed with a throwaway debug key,
#                                        and each new build must be installed after uninstalling the previous one.
# Repository variable (not secret): RIDER_API_URL, the server address (defaults to the Railway deployment).
name: Rider app

on:
  push:
    paths: ['rider-app/**', '.github/workflows/rider-app.yml']
  pull_request:
    paths: ['rider-app/**', '.github/workflows/rider-app.yml']
  workflow_dispatch:

permissions:
  contents: write   # publish the APK as a GitHub Release (main branch and manual runs only)

concurrency:
  group: rider-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rider-app
    steps:
      - uses: actions/checkout@v4

      - name: Check the app has no rider pay features
        run: |
          # The rider app must not contain any pay / earnings functionality (see project requirements).
          if grep -rniE "earning|commission|incentive|bonus|payout|salary|payroll|delivery[ _-]?fee|\btips?\b|revenue|profit|income|wage" app/src/main; then
            echo "::error::Rider pay related wording found in the rider app (listed above). Remove it before release."
            exit 1
          fi

      - name: Check no secrets are committed
        run: |
          if grep -rnE "AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC )?PRIVATE KEY|\"private_key\"" app/src; then
            echo "::error::A key or credential appears to be committed in the app source."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        env:
          # Accepted from repository secrets (preferred) or, if they were saved there instead, repository variables.
          KEYSTORE_B64: ${{ secrets.RIDER_KEYSTORE_BASE64 || vars.RIDER_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.RIDER_KEYSTORE_PASSWORD || vars.RIDER_KEYSTORE_PASSWORD }}
        run: |
          # Report only whether each value was found, never the value itself.
          echo "RIDER_KEYSTORE_BASE64: $([ -n "$KEYSTORE_B64" ] && echo found || echo MISSING) · RIDER_KEYSTORE_PASSWORD: $([ -n "$KEYSTORE_PW" ] && echo found || echo MISSING)"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ]; then
            echo "::add-mask::$KEYSTORE_PW"
            echo "RIDER_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            # Tolerate spaces or line breaks added when pasting.
            printf %s "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/rider.jks" || { echo "::error::RIDER_KEYSTORE_BASE64 is not valid base64. Paste the whole long line again."; exit 1; }
            echo "RIDER_KEYSTORE_FILE=$RUNNER_TEMP/rider.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH_RELEASE_KEY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing key not found (see the line above): the release APK is signed with a debug key (fine for testing, not for the Play Store)."
          fi

      - name: Unit tests and build
        env:
          RIDER_API_URL: ${{ vars.RIDER_API_URL }}
          RIDER_VERSION_CODE: ${{ github.run_number }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          RIDER_KEY_ALIAS: ${{ secrets.RIDER_KEY_ALIAS }}
          RIDER_KEY_PASSWORD: ${{ secrets.RIDER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p ../apk
          cp app/build/outputs/apk/release/app-release.apk ../apk/BowlManiaRider-${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../apk/BowlManiaRider-${{ github.run_number }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BowlManiaRider-apk-${{ github.run_number }}
          path: apk/*.apk
          retention-days: 30

      # A stable public download link: .../releases/latest/download/BowlManiaRider.apk
      - name: Publish release
        # Only apps signed with the permanent key are published, so updates always install over the old app.
        if: env.SIGNED_WITH_RELEASE_KEY == '1' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ../apk/BowlManiaRider-${{ github.run_number }}.apk ../apk/BowlManiaRider.apk
          tag="rider-v1.0.${{ github.run_number }}"
          gh release create "$tag" ../apk/BowlManiaRider.apk --target "${{ github.sha }}" --latest \
            --title "Bowl Mania Rider 1.0 (build ${{ github.run_number }})" \
            --notes "Android app for Bowl Mania delivery staff. Download BowlManiaRider.apk on the phone, open it and allow installing from this source. Sign in with your Delivery Staff account."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: rider-app/app/build/reports/
          retention-days: 7
