# Temporary: transcribe the bundled Hanuman Chalisa with timestamps so its verses can be synced. Removed after use.
name: Align Chalisa
on:
  push:
    paths: ['.github/workflows/align-chalisa.yml']
permissions:
  contents: read
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q faster-whisper==1.1.1 requests
      - name: Transcribe with word timestamps
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          m = WhisperModel("medium", device="cpu", compute_type="int8")
          segs, info = m.transcribe("prabhat-app/app/src/main/res/raw/hanuman_chalisa.m4a", language="hi",
                                    word_timestamps=True, vad_filter=False, beam_size=5,
                                    initial_prompt="श्रीगुरु चरन सरोज रज। जय हनुमान ज्ञान गुन सागर। जय कपीस तिहुँ लोक उजागर। राम दूत अतुलित बल धामा।")
          for s in segs:
              print(f"SEG {s.start:7.2f} {s.end:7.2f} | {s.text.strip()}")
              print("   W " + " ".join(f"{w.start:.1f}:{w.word.strip()}" for w in (s.words or [])))
          PY
