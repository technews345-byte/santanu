name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/expense-budget-app-vdww3s

permissions:
  contents: write

# The release tag is shared, so an older run finishing late would publish a
# stale APK over a newer one.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # Exactly the versions in package-lock.json, verified against their
      # recorded checksums: a build never picks up a newly published (or
      # tampered) release of anything. Actions above are pinned to commits for
      # the same reason — a moved tag can't change what runs here.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # The template's 512m metaspace is not enough to compile every Expo
      # module in one daemon. Set this in Gradle's user-level config, which
      # takes precedence over the generated project file — appending to that
      # file corrupts its last property, since prebuild writes no trailing
      # newline.
      - name: Raise Gradle memory limits
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m" >> ~/.gradle/gradle.properties

      # Signing. The generated project signs release builds with React
      # Native's public debug key, which anyone can download — so anyone could
      # sign an "update" that installs over Spendly and inherits its data.
      # A private release key is mandatory. Never publish a debug-signed APK.
      # Secrets never reach the log, and the decoded key is deleted after the build.
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the private release key."
          else
            echo "::error::A private release key is required. Configure the ANDROID_KEYSTORE_* secrets before publishing."
            exit 1
          fi

      - name: Build release APK
        working-directory: android
        timeout-minutes: 60
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # One ABI only: every phone from the last decade is arm64, and building
        # all four multiplies the native compile time.
        run: |
          for REQUIRED_VALUE in "$SIGNING_STORE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$REQUIRED_VALUE" ]; then
              echo "::error::Release signing configuration is incomplete."
              exit 1
            fi
          done
          SIGNING=()
          if [ -n "$SIGNING_STORE" ]; then
            SIGNING=(
              "-Pandroid.injected.signing.store.file=$SIGNING_STORE"
              "-Pandroid.injected.signing.store.password=$STORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
          fi
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a "${SIGNING[@]}"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spendly-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-apk --yes || true
          git push --delete origin android-apk || true
          gh release create android-apk \
            android/app/build/outputs/apk/release/app-release.apk \
            --title "Spendly — Android APK" \
            --notes "Install on Android: tap the .apk below, then allow installation from unknown sources. Built from ${GITHUB_SHA}." \
            --prerelease \
            --target "${GITHUB_SHA}"
